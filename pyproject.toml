[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelconfig"
version = "1.1.0"
description = "CamelConfig (Cml) parser, writer, validator and toolkit for Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "matkecn" }
]
keywords = ["camelconfig", "cml", "configuration", "parser", "config"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup"
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/matkecn/camel"
Repository = "https://github.com/matkecn/camel"
Issues = "https://github.com/matkecn/camel/issues"
Documentation = "https://github.com/matkecn/camel#readme"

[project.scripts]
cml = "camel.__main__:main"

[tool.setuptools]
packages = ["camel"]

[tool.setuptools.package-data]
camel = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 120
